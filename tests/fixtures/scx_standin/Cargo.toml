[package]
name = "scx-standin"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "scx-standin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libbpf-rs = { version = "0.26", default-features = false, features = ["vendored"] }
libbpf-sys = { version = "1.6", default-features = false, features = ["vendored"] }
libc = "0.2"

[build-dependencies]
cc = "1"
libbpf-cargo = "0.26"
