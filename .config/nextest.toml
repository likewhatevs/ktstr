# ── Profiles ──────────────────────────────────────────────────────────

# SCHEDULING MODEL: nextest is a pure SPAWNER; the lock-dir admission
# registry is the actual scheduler (see host_topology::protocol — the
# "second-order scheduler"). Under the default and CI profiles, nextest
# admits every lock-taking cell at once while the `host-tests` group
# bounds ordinary host work. Cells park CHEAPLY on targeted cross-process
# futexes (before VM setup or guest-memory allocation) until their exact
# claims can run. Consequences for this config:
#
#  - Reported per-test DURATIONS INCLUDE ADMISSION WAIT. That is
#    accepted; no effort is spent excluding admission wait from timings
#    or slow-test flagging.
#  - slow-timeout bounds for lock-taking cells must exceed the FULL
#    suite drain, not one cell's runtime, because the deepest-waiting
#    cell's wall approaches the whole makespan. The in-cell progress
#    watchdog owns guest-lifecycle detection; nextest terminate-after
#    owns the final process-lifecycle bound. The admission registry does not
#    guess that a healthy holder is wedged from wall time. See the
#    vm-cell override block below for the sizing derivation.
#  - ResourceContention from transient host syscalls is a RETRYABLE
#    failure, never a skip; these retries re-run it alongside the true
#    transient flakes, which typically resolve by retry 2-3. max-delay
#    keeps the per-failure budget tight.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 2 }
retries = { backoff = "exponential", count = 5, delay = "1s", jitter = true, max-delay = "3s" }
test-threads = 1_000_000

[profile.default.junit]
path = "junit.xml"

# The default and CI profiles use a deliberately large ADMISSION pool so
# every lock-taking VM cell can reach ktstr's resource scheduler. A
# CPU-sized nextest pool is not sufficient: queued cells still consume
# nextest slots, so an unlucky set of blocked claims can fill that pool
# while a not-yet-admitted cell would fit the host's free topology. That
# creates a second, non-work-conserving scheduler above ktstr.
#
# `test-threads` is an async slot budget, not nextest's native Tokio
# worker count. The runtime remains host-sized. Ordinary tests are
# assigned to `host-tests` below; once that group reaches `num-cpus`,
# nextest queues later ordinary tests inside the group without charging
# global slots and keeps scanning until every cheap VM acquisition
# waiter has started. Thus this does not launch all 11k host tests.
#
# One million makes global admission effectively unbounded without tying the
# ceiling to today's suite size. nextest's future-queue reserves one u64
# slot-id entry per permit (~8 MiB here), but does not create threads or tasks
# eagerly; an integer-max value would therefore be wasteful. cargo-ktstr also
# replaces every syntactically valid CLI `-j`/`--test-threads` spelling with
# this value so no user or repository setting creates a second admission queue.
[profile.ci]
slow-timeout = { period = "90s", terminate-after = 3 }
retries = { backoff = "exponential", count = 6, delay = "1s", jitter = true, max-delay = "3s" }
test-threads = 1_000_000
status-level = "pass"
final-status-level = "flaky"
failure-output = "immediate-final"
fail-fast = false

[profile.ci.junit]
path = "junit.xml"

[test-groups.host-tests]
max-threads = "num-cpus"

# CI overrides take priority when `--profile ci` is selected; nextest then
# falls back to matching `profile.default.overrides`. The CI copies below
# either carry CI-specific settings or pin intended CI precedence explicitly.

# LOCK-TAKING VM CELLS: final process bound sized for FULL-SUITE DRAIN,
# not per-cell runtime (overrides are first-match per setting, so this
# must stay FIRST to win slow-timeout for these filters; later
# blocks still contribute retries / test-groups). Derivation: nextest
# admits every cell at once and the admission registry schedules to host
# capacity, so the deepest-queued cell's nextest-visible wall ≈ the
# whole VM-suite makespan (its reported duration INCLUDES queue time —
# accepted), and every admitted cell dilates fairly with deliberate
# 4x permit oversubscription: guests share CPUs, so charged wall runs a
# small multiple of delivered service under full load. The in-cell
# progress watchdog is dilation-aware (delivered-service tiers plus a
# process-clock wall net) and is the ARBITER for wedged or starved
# cells — it kills with a forensic dump long before this bound. This
# rail exists only for defects outside the watchdog (or an unforeseen
# queue bug). Measured CI reference (192-CPU runner, 3 colocated
# lanes, full suite): 60-90 legitimately progressing cells per lane
# charge 1000-1260 s queue-plus-dilation; 180 s × 12 = 36 min clears
# that envelope with margin instead of coin-flipping correct runs at
# 21 min, while still bounding a genuine escape to ~one lane-length.
# A contention-killed cell remains retryable and normally retries
# after the queue has drained.
[[profile.ci.overrides]]
filter = '''
test(/^ktstr\//)
| test(/^gauntlet\//)
| test(/^verifier\//)
| (
  binary(=ktstr)
  & (
    test(/^vmm::tests::(boot_kernel_.*|bench_boot_time.*|monitor_data_valid_latch_records_live_page_offset|sys_rdy_releases_monitor_before_5s_timeout|monitor_exits_cleanly_when_guest_panics_before_sys_rdy|first_sample_has_valid_rq_clock_thanks_to_sys_rdy|watchdog_timeout_override_lands_in_guest_memory|watchdog_override_prevents_stall_exit|sched_domain_data_populated)$/)
    | test(/^cli::kernel_build::build::tests::acquire_build_reservation_(bypass_empty_string_rejected|plan_and_make_jobs_consistent)$/)
  )
)
| binary(=shell_mode_scheduler_lifecycle_e2e)
| binary(=disk_template_e2e)
| binary(=vm_integration)
| binary(=extra_kconfig_e2e)
| binary(=wprof_e2e)
| binary(=verifier_pipeline)
| (
  binary(=ktstr_cli)
  & test(=shell_exec_echo)
)
| (
  binary(=cargo_ktstr_shell_test_e2e)
  & test(=shell_test_resolves_topology_from_named_test)
)
| (
  binary(=cargo_ktstr_verifier_discovery)
  & test(/^bare_verifier_(recursively_discovers_feature_gated_workspace_test_binaries|runs_recursively_discovered_scheduler_cell_end_to_end)$/)
)
'''
slow-timeout = { period = "180s", terminate-after = 12 }

[[profile.ci.overrides]]
filter = "test(demo_)"
slow-timeout = { period = "120s", terminate-after = 3 }
retries = 6

# disk_template_e2e drives a NESTED `cargo ktstr test` whose guest VM
# brings up the disk-template lifecycle (one-shot template-build VM +
# per-test FICLONE clone + scenario VM). That nested boot-readiness
# handshake is load-sensitive: under host contention from the rest of
# the suite the guest's send_sys_rdy window (see `sys_rdy_budget_ms`)
# can slip and the run reports no result. The additive boot-budget
# scaling widens that window in-VM; these retries absorb the residual
# host-load jitter so a transient slow boot recovers instead of failing
# the job. Count is 12, above the profile's 6 base, because this nested
# boot is more load-sensitive than the rest of the suite: the flake has
# been observed recovering by attempt 4, so 12 keeps a ~3x margin, and
# the longer inter-retry delay lets concurrent VM load subside before
# each retry. Slow-timeout
# is generous for the nested template-build + scenario boot, especially
# under the coverage job's llvm-cov instrumentation.
[[profile.ci.overrides]]
filter = "test(disk_template_e2e)"
slow-timeout = { period = "180s", terminate-after = 3 }
retries = { backoff = "exponential", count = 12, delay = "3s", jitter = true, max-delay = "10s" }

[[profile.ci.overrides]]
filter = "binary(compile_fail) & test(=compile_fail)"
slow-timeout = { period = "180s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = "test(cached_releases_with_non_singleton_bypasses_cache)"
slow-timeout = { period = "240s", terminate-after = 3 }
retries = 6

[[profile.ci.overrides]]
filter = "test(eevdf_)"
slow-timeout = { period = "75s", terminate-after = 3 }
retries = 6

# Progress-watchdog wedge fixtures: deliberately injected forever-wedges
# the watchdog must kill on the correct tier, so a watchdog kill is the
# EXPECTED outcome, never a transient flake — retries=0 (a re-run of a
# real net regression burns a full rail-length again and hides the
# determinism of the failure). The wedge cells are named `ktstr/…`, so
# the resource-band block above already owns their slow-timeout by
# first-match precedence, and under CI dilation they legitimately charge
# queue-inclusive wall like every other cell; the watchdog, not nextest,
# kills the wedge and produces the dump the assertions consume. This
# binary also holds one plain host-side `#[test]`
# (`boot_before_wedge_is_a_non_verdict_even_without_a_timeout`, a pure
# classifier check) that the band does NOT cover — its slow-timeout
# comes from the profile.default copy below, which nextest consults for
# every setting no ci override supplies. So this block carries retries
# only.
[[profile.ci.overrides]]
filter = "binary(progress_watchdog_e2e)"
retries = 0

[[profile.ci.overrides]]
filter = "test(pathology_alu_hot_iterates) | test(alu_hot_vec512)"
test-group = "alu-vec512"
threads-required = 1

[[profile.ci.overrides]]
filter = "test(acquire_llc_plan_) | test(resource_lock_exclusive_) | test(resource_lock_shared_) | test(resource_lock_contention_returns_unavailable) | test(resource_lock_all_or_nothing) | test(resource_lock_service_cpu_contention) | test(resource_lock_empty_llc_indices) | test(resource_lock_release_on_drop)"
test-group = "llc-lock"
threads-required = 1

[[profile.ci.overrides]]
filter = "binary(compile_fail) & test(=compile_fail)"
test-group = "compile-fail"
threads-required = 1

# Wide-SMP boot tests: every ~256-vCPU topology (16-LLC × 16-core, or
# 14×9×2) overcommits its vCPU threads onto the host cpuset (~1.3x on a
# 192-CPU runner). Boot wall-clock stretches under that overcommit, but
# the wall deadline no longer scales with it: `vm_timeout_from_entry` is
# the Tier-3 dead-man formula (base max(watchdog_timeout_s, duration, 1)
# + vm_boot_headroom(256)=58.4s × DEADMAN_HEADROOM_MULT=3 ≈ 235s for
# these tests), and a slow-but-progressing boot is protected by the
# progress watchdog instead of a ratio-scaled deadline. The binding case
# is pos_expect_auto_repro_satisfied_wide_smp: it boots TWO 256-vCPU VMs
# sequentially (primary + auto-repro), each with its OWN ~235s deadman,
# so a healthy two-VM run can reach ~470s. That two-VM wprof-inversion
# chain auto-skips above EXPECT_AUTO_REPRO_SKIP_RATIO (2.0x) — far below
# the OVERCOMMIT_SKIP_RATIO (6x) boot-or-skip gate — because its repro-VM
# trace transport is fragile under host time-slicing; so it RUNS only on
# a host with MORE than 128 CPUs (256 vCPUs at < 2.0x; exactly 128 CPUs =
# 2.0x SKIPS, the cap being inclusive) and SKIPS cleanly on a 96-CPU
# runner (2.7x) instead of hard-failing, while single-VM wide-SMP boot
# tests keep the 6x skip gate. slow-timeout 960s/terminate-after 1 covers that two-VM
# worst running case so the per-VM framework watchdog fires FIRST (a
# clean failure dump) rather than nextest blunt-killing a still-booting
# second VM; single-VM wide tests fail at their ≤470s watchdog long
# before 960s, so the larger budget is harmless for them, and on a
# 192-CPU runner (~1.3x) every test finishes in a few hundred seconds,
# far under 960s. The resource registry, rather than a second nextest
# queue, admits these cells against their exact host-CPU/LLC reservations.
# The filter is test()-scoped for snapshot_real_capture_e2e /
# expect_auto_repro_e2e so only their wide-SMP tests get this timeout;
# their lighter siblings keep normal budgets. retries = 2 absorbs
# residual host-load jitter; the per-VM watchdog bounds each attempt, so
# this is not a retry storm.
[[profile.ci.overrides]]
filter = "binary(wide_smp_boot_e2e) | binary(wide_smp_device_irq_e2e) | binary(wide_smp_net_irq_e2e) | test(multi_llc_guest_presents_fat_l3_wide_smp) | test(snapshot_real_capture_wide_smp) | test(pos_expect_auto_repro_satisfied_wide_smp)"
slow-timeout = { period = "960s", terminate-after = 1 }
retries = 2

# Keep ordinary host-side tests CPU-bounded even though the global CI
# slot budget admits every resource-lock user. Put this fallback after
# the ordinary-host specialized groups: nextest selects the first matching
# value for each setting, so compile-fail, llc-lock, and alu-vec512 retain
# their stronger host-test rules.
#
# This is the canonical RESOURCE-ADMISSION identity selector. The
# full-suite-drain timeout above deliberately copies this exact set because
# admission wait is charged to each test; a unit test pins that equality.
# Other long-timeout policies can still cover non-resource work (for example
# fetch retry tests). Direct KtstrVm / nested cargo-ktstr callers take locks
# without having a generated ktstr/... name, so a loose name-only selector
# would both leak ordinary tests into the effectively-unbounded global pool
# and trap real VM waiters behind host-tests.
#
# Generated ktstr/, gauntlet/, and verifier/ cells participate in the
# scheduler. Generated host_only tests are emitted under the distinct host/
# namespace, so ordinary host-only macro/codegen probes fall into host-tests
# without a brittle per-test allowlist. verifier_pipeline is the deliberate
# exception: its host/-named drivers call the verifier API directly, which
# boots KtstrVm internally after suppressing only the outer generated harness
# VM. The remaining arms cover direct KtstrVm users, shell/verifier wrappers,
# ignored nested-VM/kernel-build shims, and the two production-lock
# reservation tests. This CI complement declines those identities; the
# inherited profile.default resource rule below then explicitly assigns them
# to @global before the lower-priority tool fallback can classify their
# ordinary Rust names as host work. Everything else enters the CPU-sized
# host-tests group.
[[profile.ci.overrides]]
filter = '''
not(
  test(/^ktstr\//)
  | test(/^gauntlet\//)
  | test(/^verifier\//)
  | (
    binary(=ktstr)
    & (
      test(/^vmm::tests::(boot_kernel_.*|bench_boot_time.*|monitor_data_valid_latch_records_live_page_offset|sys_rdy_releases_monitor_before_5s_timeout|monitor_exits_cleanly_when_guest_panics_before_sys_rdy|first_sample_has_valid_rq_clock_thanks_to_sys_rdy|watchdog_timeout_override_lands_in_guest_memory|watchdog_override_prevents_stall_exit|sched_domain_data_populated)$/)
      | test(/^cli::kernel_build::build::tests::acquire_build_reservation_(bypass_empty_string_rejected|plan_and_make_jobs_consistent)$/)
    )
  )
  | binary(=shell_mode_scheduler_lifecycle_e2e)
  | binary(=disk_template_e2e)
  | binary(=vm_integration)
  | binary(=extra_kconfig_e2e)
  | binary(=wprof_e2e)
  | binary(=verifier_pipeline)
  | (
    binary(=ktstr_cli)
    & test(=shell_exec_echo)
  )
  | (
    binary(=cargo_ktstr_shell_test_e2e)
    & test(=shell_test_resolves_topology_from_named_test)
  )
  | (
    binary(=cargo_ktstr_verifier_discovery)
    & test(/^bare_verifier_(recursively_discovers_feature_gated_workspace_test_binaries|runs_recursively_discovered_scheduler_cell_end_to_end)$/)
  )
)
'''
test-group = "host-tests"
threads-required = 1

# vmm::sched_stats tests share a binary whose first-attempt load is
# slow under cold page cache + concurrent test-runner contention.
# Observed: try 1 hit profile.default's 60s x 2 = 120s slow-timeout;
# try 2 passed in 0.014s once the binary was in the page cache. The
# test logic itself is trivial — make_client + pre_populate +
# request_raw — and both ends of the cvar handshake are race-safe:
# pre_populate (sched_stats.rs:1036-1055) follows the standard cvar
# producer pattern (acquire mutex, append bytes, notify_all WHILE
# holding the mutex, release on guard drop), and request_raw's loop
# at the response_buf check site re-inspects the buffer BEFORE
# cvar.wait, so a populated buf is detected on first iteration even
# if the producer's notify fires before the consumer enters wait.
# 180s per attempt absorbs the cold binary load on the ARM64 runners
# that observed the original 120s timeout; terminate-after=1 keeps
# the per-attempt cap tight (one slow period elapsed = kill), and
# retries=3 covers up-to-3 cold-cache instances per test. Worst-case
# budget per test is 4 attempts x 180s = 720s = 12 min, vs the
# 54-min budget a larger retries x terminate-after product would
# create — tight enough that a real deadlock (e.g. an unanswered
# cvar.wait) surfaces in single-digit minutes rather than masking
# under retry. Override mirrored across profile.default AND
# profile.ci so local dev cold-cache runs get the same budget as
# CI (without it, `cargo ktstr test --kernel ../linux` would hit
# profile.default's 60s x 2 budget locally). Filter targets every
# test in the vmm::sched_stats compiled binary (module-path prefix,
# trailing `::` bounds the match so a future `vmm::sched_stats_v2`
# sibling would not accidentally inherit). Any current or future
# sibling in the same binary picks up the budget — the cold-load
# contention is binary-wide, not per-test.
# LOCK-TAKING VM CELLS, default profile: same full-suite-drain rail as
# profile.ci (see that block's derivation) — kept first so it wins
# slow-timeout for these filters; later blocks still contribute their
# other settings.
[[profile.default.overrides]]
filter = '''
test(/^ktstr\//)
| test(/^gauntlet\//)
| test(/^verifier\//)
| (
  binary(=ktstr)
  & (
    test(/^vmm::tests::(boot_kernel_.*|bench_boot_time.*|monitor_data_valid_latch_records_live_page_offset|sys_rdy_releases_monitor_before_5s_timeout|monitor_exits_cleanly_when_guest_panics_before_sys_rdy|first_sample_has_valid_rq_clock_thanks_to_sys_rdy|watchdog_timeout_override_lands_in_guest_memory|watchdog_override_prevents_stall_exit|sched_domain_data_populated)$/)
    | test(/^cli::kernel_build::build::tests::acquire_build_reservation_(bypass_empty_string_rejected|plan_and_make_jobs_consistent)$/)
  )
)
| binary(=shell_mode_scheduler_lifecycle_e2e)
| binary(=disk_template_e2e)
| binary(=vm_integration)
| binary(=extra_kconfig_e2e)
| binary(=wprof_e2e)
| binary(=verifier_pipeline)
| (
  binary(=ktstr_cli)
  & test(=shell_exec_echo)
)
| (
  binary(=cargo_ktstr_shell_test_e2e)
  & test(=shell_test_resolves_topology_from_named_test)
)
| (
  binary(=cargo_ktstr_verifier_discovery)
  & test(/^bare_verifier_(recursively_discovers_feature_gated_workspace_test_binaries|runs_recursively_discovered_scheduler_cell_end_to_end)$/)
)
'''
slow-timeout = { period = "180s", terminate-after = 12 }

[[profile.default.overrides]]
filter = "test(vmm::sched_stats::)"
slow-timeout = { period = "180s", terminate-after = 1 }
retries = 3

[[profile.ci.overrides]]
filter = "test(vmm::sched_stats::)"
slow-timeout = { period = "180s", terminate-after = 1 }
retries = 3

[profile.quick]
# Usage: cargo nextest run --profile quick
slow-timeout = { period = "10s", terminate-after = 2 }

# ── Overrides ─────────────────────────────────────────────────────────

# Demo tests: exploration/failure scenarios, should not retry.
[[profile.default.overrides]]
filter = "test(demo_)"
slow-timeout = { period = "120s", terminate-after = 2 }
retries = 0

# Compile-fail tests: trybuild compiles the dependency tree on first run.
# The driver is ignored in the ordinary suite and selected alone by
# `just compile-fail`, so unrelated tests do not share that dedicated CI
# invocation. The group below serializes any future additional fixture
# drivers selected by that recipe; a group limit does not reserve the global
# nextest pool against tests outside the group.
[[profile.default.overrides]]
filter = "binary(compile_fail) & test(=compile_fail)"
slow-timeout = { period = "180s", terminate-after = 2 }

# cached_releases bypass test: drives a localhost mock through the
# fetch.rs URL-injection seam. Observed exhausting the ci profile's
# 270s slow-timeout budget (90s × 3) on ARM64 runners. The test
# itself is bounded by a 60s reqwest timeout per attempt, so the only
# way to hit 270s is repeated retries — each retry replays the same
# RELEASES_CACHE OnceLock state and the same mockito server path,
# so a failure is never transient. retries=0 keeps a single attempt
# and surfaces any genuine regression as a fast failure rather than
# letting the retry storm consume the timeout budget. The 240s × 2
# slow-timeout matches the boot_kernel ceiling and gives the slowest
# observed ARM64 runner room to complete the bind+accept+request
# round-trip without nextest pre-empting it.
[[profile.default.overrides]]
filter = "test(cached_releases_with_non_singleton_bypasses_cache)"
slow-timeout = { period = "240s", terminate-after = 2 }
retries = 0

# EEVDF tests: no sched_ext scheduler attached, so VM lifecycle is
# bounded by vm_timeout_from_entry (base = max(watchdog, duration, 1s),
# plus vm_boot_headroom = 10s + sys_rdy_budget_ms(vcpus), that headroom
# scaled by the host overcommit ratio) plus VM setup overhead. 75s
# gives a margin above that ceiling so
# nextest does not race the watchdog. retries=0 because a watchdog
# timeout is never transient — re-running just burns the same time.
[[profile.default.overrides]]
filter = "test(eevdf_)"
slow-timeout = { period = "75s", terminate-after = 2 }
retries = 0

# Progress-watchdog wedge fixtures (explicit default-profile copy of the
# higher-priority profile.ci rule). Two fixtures inject
# a forever-wedge the watchdog must kill on Tier-1/Tier-2, so a watchdog
# timeout is the EXPECTED outcome — retries=0. 150s x 2 sits above the
# ~150s Tier-3 deadman of these 1-vCPU watchdog_timeout_s=90 cells so the
# framework watchdog decides the cell on the idle regression path, and the
# terminate-after remains the last rail if both Tier-1 and Tier-3's
# active-cell CPU backstop regress. See the binary's module doc for the
# full timing derivation.
[[profile.default.overrides]]
filter = "binary(progress_watchdog_e2e)"
slow-timeout = { period = "150s", terminate-after = 2 }
retries = 0

# Wide-SMP boot tests: explicit default-profile copy of the higher-priority
# profile.ci rule. 960s/terminate-after 1 covers
# the two-VM auto-repro test's worst running case so the per-VM framework
# watchdog (vm_timeout_from_entry, flat dead-man boot headroom) fires
# before nextest's kill even under a local dev box's higher overcommit
# ratio. The ktstr registry remains the only resource scheduler.
# See the profile.ci copy for the full rationale.
[[profile.default.overrides]]
filter = "binary(wide_smp_boot_e2e) | binary(wide_smp_device_irq_e2e) | binary(wide_smp_net_irq_e2e) | test(multi_llc_guest_presents_fat_l3_wide_smp) | test(snapshot_real_capture_wide_smp) | test(pos_expect_auto_repro_satisfied_wide_smp)"
slow-timeout = { period = "960s", terminate-after = 1 }
retries = 2

# ── alu-vec512 ───────────────────────────────────────────────────────
# AVX-512 / AMX execution triggers package-wide frequency throttle on
# x86: vector-heavy code drops the package's all-core frequency
# (license-2/license-3 transitions in skylake-X-and-later) and AMX
# tile loads add tens-of-microseconds on TILELOAD/TILEZERO. A
# concurrent test running on the same socket sees iteration latency
# from the throttled clock, not from the scheduler — and any
# scheduler-latency assertion in the neighbouring test becomes
# noisy. Serialize tests whose AluHot path may resolve to
# `AluWidth::Vec512` or `AluWidth::Amx` so the throttle envelope is
# deterministic.
[test-groups.alu-vec512]
max-threads = 1

# `pathology_alu_hot_iterates` runs `AluWidth::Widest`, which
# `resolve_alu_width` (src/workload/worker/mod.rs) downgrades to Vec512 on
# avx512f hosts (Vec256/Vec128/Scalar otherwise). AMX is not
# probed on stable Rust — `AluWidth::Amx` always downgrades to
# the widest stable-detectable variant. The `alu_hot_vec512`
# arm gives future Vec512 SIMD-intrinsic tests a stable naming
# hook so they auto-serialize without a config change.
[[profile.default.overrides]]
filter = "test(pathology_alu_hot_iterates) | test(alu_hot_vec512)"
test-group = "alu-vec512"
threads-required = 1

# ── llc-lock ─────────────────────────────────────────────────────────
# Serialize tests that touch `/tmp/ktstr-llc-*.lock` or
# `/tmp/ktstr-cpu-*.lock` at shared indices. Parallel runs race on
# flock state, producing EWOULDBLOCK outcomes depending on thread
# ordering and flaking the Acquired/Unavailable assertions. With
# max-threads = 1 the whole group walks sequentially through the
# host's lock pool.
[test-groups.llc-lock]
max-threads = 1

[[profile.default.overrides]]
filter = "test(acquire_llc_plan_) | test(resource_lock_exclusive_) | test(resource_lock_shared_) | test(resource_lock_contention_returns_unavailable) | test(resource_lock_all_or_nothing) | test(resource_lock_service_cpu_contention) | test(resource_lock_empty_llc_indices) | test(resource_lock_release_on_drop)"
test-group = "llc-lock"
threads-required = 1

# ── compile-fail ─────────────────────────────────────────────────────
# Serialize multiple compile-fail drivers with one another. The dedicated
# `just compile-fail` recipe selects this ignored test in isolation; this
# group is not claimed to exclude unrelated tests from the global pool.
[test-groups.compile-fail]
max-threads = 1

[[profile.default.overrides]]
filter = "binary(compile_fail) & test(=compile_fail)"
test-group = "compile-fail"
threads-required = 1

# Explicitly keep every repository-known resource user in nextest's global
# admission pool. Merely excluding these identities from the repository's
# host fallback is insufficient: nextest would continue down its
# source-precedence chain, where cargo-ktstr's lower-priority generic tool
# fallback sees their ordinary Rust names and assigns them to its CPU-sized
# host group. Selected custom profiles fall back to profile.default overrides,
# so this single rule also protects `--profile ci` after its complementary
# host fallback declines the same identities. Resource users deliberately
# have no repository-level concurrency group: the ktstr registry is their
# sole admission scheduler.
[[profile.default.overrides]]
filter = '''
test(/^ktstr\//)
| test(/^gauntlet\//)
| test(/^verifier\//)
| (
  binary(=ktstr)
  & (
    test(/^vmm::tests::(boot_kernel_.*|bench_boot_time.*|monitor_data_valid_latch_records_live_page_offset|sys_rdy_releases_monitor_before_5s_timeout|monitor_exits_cleanly_when_guest_panics_before_sys_rdy|first_sample_has_valid_rq_clock_thanks_to_sys_rdy|watchdog_timeout_override_lands_in_guest_memory|watchdog_override_prevents_stall_exit|sched_domain_data_populated)$/)
    | test(/^cli::kernel_build::build::tests::acquire_build_reservation_(bypass_empty_string_rejected|plan_and_make_jobs_consistent)$/)
  )
)
| binary(=shell_mode_scheduler_lifecycle_e2e)
| binary(=disk_template_e2e)
| binary(=vm_integration)
| binary(=extra_kconfig_e2e)
| binary(=wprof_e2e)
| binary(=verifier_pipeline)
| (
  binary(=ktstr_cli)
  & test(=shell_exec_echo)
)
| (
  binary(=cargo_ktstr_shell_test_e2e)
  & test(=shell_test_resolves_topology_from_named_test)
)
| (
  binary(=cargo_ktstr_verifier_discovery)
  & test(/^bare_verifier_(recursively_discovers_feature_gated_workspace_test_binaries|runs_recursively_discovered_scheduler_cell_end_to_end)$/)
)
'''
test-group = "@global"
threads-required = 1

# Assign the exact complement to ordinary host work. Keep this fallback after
# the explicit resource assignment and every named default-profile
# test-group override. The generated host/ namespace makes ordinary
# host_only entries fall into host-tests without a per-test allowlist;
# verifier_pipeline remains the exact binary-level exception because its
# host/-named bodies boot verifier VMs directly.
[[profile.default.overrides]]
filter = '''
not(
  test(/^ktstr\//)
  | test(/^gauntlet\//)
  | test(/^verifier\//)
  | (
    binary(=ktstr)
    & (
      test(/^vmm::tests::(boot_kernel_.*|bench_boot_time.*|monitor_data_valid_latch_records_live_page_offset|sys_rdy_releases_monitor_before_5s_timeout|monitor_exits_cleanly_when_guest_panics_before_sys_rdy|first_sample_has_valid_rq_clock_thanks_to_sys_rdy|watchdog_timeout_override_lands_in_guest_memory|watchdog_override_prevents_stall_exit|sched_domain_data_populated)$/)
      | test(/^cli::kernel_build::build::tests::acquire_build_reservation_(bypass_empty_string_rejected|plan_and_make_jobs_consistent)$/)
    )
  )
  | binary(=shell_mode_scheduler_lifecycle_e2e)
  | binary(=disk_template_e2e)
  | binary(=vm_integration)
  | binary(=extra_kconfig_e2e)
  | binary(=wprof_e2e)
  | binary(=verifier_pipeline)
  | (
    binary(=ktstr_cli)
    & test(=shell_exec_echo)
  )
  | (
    binary(=cargo_ktstr_shell_test_e2e)
    & test(=shell_test_resolves_topology_from_named_test)
  )
  | (
    binary(=cargo_ktstr_verifier_discovery)
    & test(/^bare_verifier_(recursively_discovers_feature_gated_workspace_test_binaries|runs_recursively_discovered_scheduler_cell_end_to_end)$/)
  )
)
'''
test-group = "host-tests"
threads-required = 1

# Quick profile: short-circuit long-running tests.
[[profile.quick.overrides]]
filter = "test(boot_kernel) | test(bench_boot)"
slow-timeout = { period = "60s", terminate-after = 1 }

[[profile.quick.overrides]]
filter = "test(cover_) | test(neg_)"
slow-timeout = { period = "60s", terminate-after = 2 }
