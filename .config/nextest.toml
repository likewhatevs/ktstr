# ── Profiles ──────────────────────────────────────────────────────────

# ResourceContention SKIPs cleanly at the macro layer so retries
# only fire on true transient flakes, which typically resolve by
# retry 2-3. max-delay=5s keeps the per-failure budget tight:
# worst case 8 retries × 5s = 40s of delay (plus test execution).
#
# test-threads = 16 caps parallelism well below `num-cpus` on
# high-core dev boxes so VM-pinning,
# cpuset/cgroup allocation, RLIMIT-touching tests, and shared-file-
# lock holders don't step on each other's environment state. The
# 16 ceiling is roughly one test per LLC group on typical desktop
# and CI hosts. Individual binaries that genuinely benefit from
# more parallelism (pure-Rust unit tests with no kernel side
# effects) can override via `--test-threads N` at invocation time.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 2 }
retries = { backoff = "exponential", count = 5, delay = "1s", jitter = true, max-delay = "3s" }
test-threads = 16

[profile.default.junit]
path = "junit.xml"

[profile.ci]
slow-timeout = { period = "90s", terminate-after = 3 }
retries = { backoff = "exponential", count = 6, delay = "1s", jitter = true, max-delay = "3s" }
failure-output = "final"
fail-fast = false

[profile.ci.junit]
path = "junit.xml"

# CI overrides — mirrors profile.default.overrides. nextest does not
# inherit overrides across profiles, so every override that should
# apply under --profile ci must be duplicated here.

[[profile.ci.overrides]]
filter = "test(boot_kernel) | test(bench_boot)"
slow-timeout = { period = "180s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = "test(/^verifier\\//)"
slow-timeout = { period = "180s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = "test(demo_)"
slow-timeout = { period = "120s", terminate-after = 3 }
retries = 6

[[profile.ci.overrides]]
filter = "test(gauntlet/)"
slow-timeout = { period = "120s", terminate-after = 3 }

# disk_template_e2e drives a NESTED `cargo ktstr test` whose guest VM
# brings up the disk-template lifecycle (one-shot template-build VM +
# per-test FICLONE clone + scenario VM). That nested boot-readiness
# handshake is load-sensitive: under host contention from the rest of
# the suite the guest's send_sys_rdy window (see `sys_rdy_budget_ms`)
# can slip and the run reports no result. The additive boot-budget
# scaling widens that window in-VM; these retries absorb the residual
# host-load jitter so a transient slow boot recovers instead of failing
# the job. Count is 12, above the profile's 6 base, because this nested
# boot is more load-sensitive than the rest of the suite: the flake has
# been observed recovering by attempt 4, so 12 keeps a ~3x margin, and
# the longer inter-retry delay lets concurrent VM load subside before
# each retry. Slow-timeout
# is generous for the nested template-build + scenario boot, especially
# under the coverage job's llvm-cov instrumentation.
[[profile.ci.overrides]]
filter = "test(disk_template_e2e)"
slow-timeout = { period = "180s", terminate-after = 3 }
retries = { backoff = "exponential", count = 12, delay = "3s", jitter = true, max-delay = "10s" }

[[profile.ci.overrides]]
filter = "binary(compile_fail) & test(=compile_fail)"
slow-timeout = { period = "180s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = "test(cached_releases_with_non_singleton_bypasses_cache)"
slow-timeout = { period = "240s", terminate-after = 3 }
retries = 6

[[profile.ci.overrides]]
filter = "test(eevdf_)"
slow-timeout = { period = "75s", terminate-after = 3 }
retries = 6

[[profile.ci.overrides]]
filter = "test(shell_exec_)"
test-group = "vm-cli"
threads-required = 1

[[profile.ci.overrides]]
filter = "test(sched_perf_)"
test-group = "vm-perf"
threads-required = 1

[[profile.ci.overrides]]
filter = "test(pathology_alu_hot_iterates) | test(alu_hot_vec512)"
test-group = "alu-vec512"
threads-required = 1

[[profile.ci.overrides]]
filter = "test(acquire_llc_plan_) | test(resource_lock_exclusive_) | test(resource_lock_shared_) | test(resource_lock_contention_returns_unavailable) | test(resource_lock_all_or_nothing) | test(resource_lock_service_cpu_contention) | test(resource_lock_empty_llc_indices) | test(resource_lock_release_on_drop)"
test-group = "llc-lock"
threads-required = 1

[[profile.ci.overrides]]
filter = "binary(compile_fail) & test(=compile_fail)"
test-group = "compile-fail"
threads-required = 1

# vmm::sched_stats tests share a binary whose first-attempt load is
# slow under cold page cache + concurrent test-runner contention.
# Observed: try 1 hit profile.default's 60s x 2 = 120s slow-timeout;
# try 2 passed in 0.014s once the binary was in the page cache. The
# test logic itself is trivial — make_client + pre_populate +
# request_raw — and both ends of the cvar handshake are race-safe:
# pre_populate (sched_stats.rs:1036-1055) follows the standard cvar
# producer pattern (acquire mutex, append bytes, notify_all WHILE
# holding the mutex, release on guard drop), and request_raw's loop
# at the response_buf check site re-inspects the buffer BEFORE
# cvar.wait, so a populated buf is detected on first iteration even
# if the producer's notify fires before the consumer enters wait.
# 180s per attempt absorbs the cold binary load on the ARM64 runners
# that observed the original 120s timeout; terminate-after=1 keeps
# the per-attempt cap tight (one slow period elapsed = kill), and
# retries=3 covers up-to-3 cold-cache instances per test. Worst-case
# budget per test is 4 attempts x 180s = 720s = 12 min, vs the
# 54-min budget a larger retries x terminate-after product would
# create — tight enough that a real deadlock (e.g. an unanswered
# cvar.wait) surfaces in single-digit minutes rather than masking
# under retry. Override mirrored across profile.default AND
# profile.ci so local dev cold-cache runs get the same budget as
# CI (without it, `cargo ktstr test --kernel ../linux` would hit
# profile.default's 60s x 2 budget locally). Filter targets every
# test in the vmm::sched_stats compiled binary (module-path prefix,
# trailing `::` bounds the match so a future `vmm::sched_stats_v2`
# sibling would not accidentally inherit). Any current or future
# sibling in the same binary picks up the budget — the cold-load
# contention is binary-wide, not per-test.
[[profile.default.overrides]]
filter = "test(vmm::sched_stats::)"
slow-timeout = { period = "180s", terminate-after = 1 }
retries = 3

[[profile.ci.overrides]]
filter = "test(vmm::sched_stats::)"
slow-timeout = { period = "180s", terminate-after = 1 }
retries = 3

# Wide-SMP boot tests: every ~256-vCPU topology (16-LLC × 16-core, or
# 14×9×2) overcommits its vCPU threads onto the host cpuset (~1.3x on a
# 192-CPU runner). The boot wall-clock grows with the overcommit ratio,
# so `vm_timeout_from_entry` scales the boot headroom by that ratio
# (clamped at 6x), giving each VM a per-VM framework watchdog of up to
# ~470s at the near-6x auto-skip boundary (base max(watchdog_timeout_s,
# duration, 1) + vm_boot_headroom(256)=58.4s × 6). The binding case is
# pos_expect_auto_repro_satisfied_wide_smp: it boots TWO 256-vCPU VMs
# sequentially (primary + auto-repro), each with its OWN ~470s watchdog,
# so a healthy two-VM run can reach ~940s. That two-VM wprof-inversion
# chain now auto-skips above EXPECT_AUTO_REPRO_SKIP_RATIO (2.0x) — far
# below the 6x boot cap — because its repro-VM trace transport is fragile
# under host time-slicing; so it RUNS (and can reach ~940s) only on a host
# with MORE than 128 CPUs (256 vCPUs at < 2.0x; exactly 128 CPUs = 2.0x
# SKIPS, the cap being inclusive) and SKIPS cleanly on a 96-CPU runner
# (2.7x) instead of hard-failing, while single-VM wide-SMP boot tests keep
# the 6x cap. slow-timeout 960s/terminate-after 1 covers that two-VM
# worst running case so the per-VM framework watchdog fires FIRST (a
# clean failure dump) rather than nextest blunt-killing a still-booting
# second VM; single-VM wide tests fail at their ≤470s watchdog long
# before 960s, so the larger budget is harmless for them, and on a
# 192-CPU runner (~1.3x) every test finishes in a few hundred seconds,
# far under 960s. The `wide-smp` test-group (max-threads = 1) serializes
# these heavy boots so they never oversubscribe EACH OTHER — two 256-vCPU
# VMs on one host is 2.6x aggregate before any other test, the
# concurrent-boot cascade that put 100+ VM tests into SLOW at one
# instant. The filter is test()-scoped for snapshot_real_capture_e2e /
# expect_auto_repro_e2e so only their wide-SMP tests join the group;
# their lighter siblings keep normal budgets. retries = 2 absorbs
# residual host-load jitter; the per-VM watchdog bounds each attempt, so
# this is not a retry storm.
[[profile.ci.overrides]]
filter = "binary(wide_smp_boot_e2e) | binary(wide_smp_device_irq_e2e) | binary(wide_smp_net_irq_e2e) | test(multi_llc_guest_presents_fat_l3_wide_smp) | test(snapshot_real_capture_wide_smp) | test(pos_expect_auto_repro_satisfied_wide_smp)"
slow-timeout = { period = "960s", terminate-after = 1 }
test-group = "wide-smp"
threads-required = 1
retries = 2

[profile.quick]
# Usage: cargo nextest run --profile quick
slow-timeout = { period = "10s", terminate-after = 2 }

# ── Overrides ─────────────────────────────────────────────────────────

# Boot tests under coverage instrumentation (llvm-cov) are 5-10x slower.
[[profile.default.overrides]]
filter = "test(boot_kernel) | test(bench_boot)"
slow-timeout = { period = "180s", terminate-after = 2 }

# Verifier cells: the internal VM watchdog is a 120s lifecycle base
# plus vCPU/oversubscription-scaled boot headroom plus the extend-only
# scheduler-attach reset (`verifier_vm_timeout` +
# `VERIFIER_WORKLOAD_BUDGET` in test_support/runtime.rs) — worst case
# ~440s for a 128-vCPU preset at the 6x headroom cap. nextest must
# exceed that so the watchdog verdict, not a nextest kill, decides the
# cell (240s x 2 = 480s; the ci profile's 180s x 3 = 540s already
# clears it). Cell names are slash-delimited
# (`verifier/<sched>/<kernel>/<preset>`, emitted by the dispatch
# macro) — the old `test(verifier_)` substring filter silently matched
# nothing, leaving cells on the profile-base 60s x 2 budget that raced
# the watchdog.
[[profile.default.overrides]]
filter = "test(/^verifier\\//)"
slow-timeout = { period = "240s", terminate-after = 2 }

# Demo tests: exploration/failure scenarios, should not retry.
[[profile.default.overrides]]
filter = "test(demo_)"
slow-timeout = { period = "120s", terminate-after = 2 }
retries = 0

# Gauntlet tests: topology preset matrix, ignored by default.
# Run with: cargo ktstr test -- --run-ignored ignored-only -E 'test(gauntlet/)'
[[profile.default.overrides]]
filter = "test(gauntlet/)"
slow-timeout = { period = "120s", terminate-after = 2 }

# Compile-fail tests: trybuild compiles the dependency tree on first run.
#
# Also flaky under parallel nextest exec — trybuild internally invokes
# `cargo build` on each fixture sharing the host's target/ directory
# with concurrent tests. A neighbour test's build can leave stale dep
# artifacts that one trybuild fixture compiles cleanly even when it
# should fail ("Expected test case to fail to compile, but it
# succeeded"). Inherits retries = 5 from profile.default which
# typically resolves the contention on try 2-3 after the concurrent
# build settles. The `compile-fail` test-group below holds the
# driver to a single slot so cross-test cargo invocations cannot
# interleave with trybuild's fixture builds; per-fixture trybuild
# cache isolation would be the definitive in-tree fix (would require
# patching the test wrapper).
[[profile.default.overrides]]
filter = "binary(compile_fail) & test(=compile_fail)"
slow-timeout = { period = "180s", terminate-after = 2 }

# cached_releases bypass test: drives a localhost mock through the
# fetch.rs URL-injection seam. Observed exhausting the ci profile's
# 270s slow-timeout budget (90s × 3) on ARM64 runners. The test
# itself is bounded by a 60s reqwest timeout per attempt, so the only
# way to hit 270s is repeated retries — each retry replays the same
# RELEASES_CACHE OnceLock state and the same mockito server path,
# so a failure is never transient. retries=0 keeps a single attempt
# and surfaces any genuine regression as a fast failure rather than
# letting the retry storm consume the timeout budget. The 240s × 2
# slow-timeout matches the boot_kernel ceiling and gives the slowest
# observed ARM64 runner room to complete the bind+accept+request
# round-trip without nextest pre-empting it.
[[profile.default.overrides]]
filter = "test(cached_releases_with_non_singleton_bypasses_cache)"
slow-timeout = { period = "240s", terminate-after = 2 }
retries = 0

# EEVDF tests: no sched_ext scheduler attached, so VM lifecycle is
# bounded by vm_timeout_from_entry (base = max(watchdog, duration, 1s),
# plus vm_boot_headroom = 10s + sys_rdy_budget_ms(vcpus), that headroom
# scaled by the host overcommit ratio) plus VM setup overhead. 75s
# gives a margin above that ceiling so
# nextest does not race the watchdog. retries=0 because a watchdog
# timeout is never transient — re-running just burns the same time.
[[profile.default.overrides]]
filter = "test(eevdf_)"
slow-timeout = { period = "75s", terminate-after = 2 }
retries = 0

# Wide-SMP boot tests: mirror of the profile.ci override (nextest does
# not inherit overrides across profiles). 960s/terminate-after 1 covers
# the two-VM auto-repro test's worst running case so the per-VM framework
# watchdog (vm_timeout_from_entry, oversub-scaled boot headroom) fires
# before nextest's kill even under a local dev box's higher overcommit
# ratio; the wide-smp test-group serializes the heavy 256-vCPU boots.
# See the profile.ci copy for the full rationale.
[[profile.default.overrides]]
filter = "binary(wide_smp_boot_e2e) | binary(wide_smp_device_irq_e2e) | binary(wide_smp_net_irq_e2e) | test(multi_llc_guest_presents_fat_l3_wide_smp) | test(snapshot_real_capture_wide_smp) | test(pos_expect_auto_repro_satisfied_wide_smp)"
slow-timeout = { period = "960s", terminate-after = 1 }
test-group = "wide-smp"
threads-required = 1
retries = 2

# ── vm-cli ───────────────────────────────────────────────────────────
[test-groups.vm-cli]
max-threads = 1

# Serialize shell_exec_* tests (CLI-spawned VMs) to avoid CPU-lock
# contention with concurrent in-process VM tests — the default
# run-lock path (acquire_run_locks → acquire_resource_locks)
# fast-fails when peers hold the per-CPU/LLC locks.
[[profile.default.overrides]]
filter = "test(shell_exec_)"
test-group = "vm-cli"
threads-required = 1

# ── vm-perf ──────────────────────────────────────────────────────────
# Caps concurrent perf-sensitive VM tests at 8 on high-core hosts.
# On hosts with fewer than 8 effective test-threads, nextest's global
# parallelism is the binding limit, so no explicit lower floor is
# needed.
[test-groups.vm-perf]
max-threads = 8

[[profile.default.overrides]]
filter = "test(sched_perf_)"
test-group = "vm-perf"
threads-required = 1

# ── alu-vec512 ───────────────────────────────────────────────────────
# AVX-512 / AMX execution triggers package-wide frequency throttle on
# x86: vector-heavy code drops the package's all-core frequency
# (license-2/license-3 transitions in skylake-X-and-later) and AMX
# tile loads add tens-of-microseconds on TILELOAD/TILEZERO. A
# concurrent test running on the same socket sees iteration latency
# from the throttled clock, not from the scheduler — and any
# scheduler-latency assertion in the neighbouring test becomes
# noisy. Serialize tests whose AluHot path may resolve to
# `AluWidth::Vec512` or `AluWidth::Amx` so the throttle envelope is
# deterministic.
[test-groups.alu-vec512]
max-threads = 1

# `pathology_alu_hot_iterates` runs `AluWidth::Widest`, which
# `resolve_alu_width` (src/workload/worker/mod.rs) downgrades to Vec512 on
# avx512f hosts (Vec256/Vec128/Scalar otherwise). AMX is not
# probed on stable Rust — `AluWidth::Amx` always downgrades to
# the widest stable-detectable variant. The `alu_hot_vec512`
# arm gives future Vec512 SIMD-intrinsic tests a stable naming
# hook so they auto-serialize without a config change.
[[profile.default.overrides]]
filter = "test(pathology_alu_hot_iterates) | test(alu_hot_vec512)"
test-group = "alu-vec512"
threads-required = 1

# ── llc-lock ─────────────────────────────────────────────────────────
# Serialize tests that touch `/tmp/ktstr-llc-*.lock` or
# `/tmp/ktstr-cpu-*.lock` at shared indices. Parallel runs race on
# flock state, producing EWOULDBLOCK outcomes depending on thread
# ordering and flaking the Acquired/Unavailable assertions. With
# max-threads = 1 the whole group walks sequentially through the
# host's lock pool.
[test-groups.llc-lock]
max-threads = 1

[[profile.default.overrides]]
filter = "test(acquire_llc_plan_) | test(resource_lock_exclusive_) | test(resource_lock_shared_) | test(resource_lock_contention_returns_unavailable) | test(resource_lock_all_or_nothing) | test(resource_lock_service_cpu_contention) | test(resource_lock_empty_llc_indices) | test(resource_lock_release_on_drop)"
test-group = "llc-lock"
threads-required = 1

# ── compile-fail ─────────────────────────────────────────────────────
# The compile_fail test driver invokes trybuild, which spawns one
# `cargo build` per fixture. Each cargo invocation grabs target/'s
# build lock; trybuild itself walks its fixtures sequentially. The
# stale-target race appears when compile_fail runs CONCURRENTLY with
# other tests that also spawn cargo invocations (or otherwise mutate
# target/) — a neighbour test's intermediate `.rmeta` /`.rlib` can
# satisfy a fixture build that should have failed. max-threads = 1
# + threads-required = 1 holds the compile_fail driver to a single
# slot, so the test-group reserves the entire pool against cross-test
# contention. Other tests outside this group keep their global
# parallelism. Within compile_fail, trybuild's fixture loop is
# already serial — the test-group does NOT change that.
[test-groups.compile-fail]
max-threads = 1

[[profile.default.overrides]]
filter = "binary(compile_fail) & test(=compile_fail)"
test-group = "compile-fail"
threads-required = 1

# ── wide-smp ─────────────────────────────────────────────────────────
# Serialize the 256-vCPU wide-SMP boot tests. Each overcommits its vCPU
# threads onto the host cpuset; running two concurrently doubles the
# oversubscription and starves both boots (the observed cascade where
# 100+ VM tests entered SLOW at one instant). max-threads = 1 walks them
# one at a time so each boot gets the full host, while still overlapping
# the lighter (non-wide) VM tests. The companion slow-timeout overrides
# (profile.ci + profile.default) keep the framework boot watchdog firing
# before nextest's kill.
[test-groups.wide-smp]
max-threads = 1

# Quick profile: short-circuit long-running tests.
[[profile.quick.overrides]]
filter = "test(boot_kernel) | test(bench_boot)"
slow-timeout = { period = "60s", terminate-after = 1 }

[[profile.quick.overrides]]
filter = "test(cover_) | test(neg_)"
slow-timeout = { period = "60s", terminate-after = 2 }
