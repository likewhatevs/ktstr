# All commands live in the justfile so they are runnable locally via
# `just <recipe>`.  The YAML handles only checkout, toolchain, cache, and
# tool installation; every `run:` step calls a justfile recipe.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  KTSTR_GHA_CACHE: "1"
  RUSTC_WRAPPER: sccache
  # Lifts github.com unauth rate limit (60/hr per IP, shared across
  # runners) to 1000/hr per-token for build.rs's busybox tarball fetch.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: just lint

  compile-fail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          tools: cargo-nextest
      - run: just compile-fail

  docs-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          tools: mdbook@0.5,lychee@0.20
      - run: cargo install mdbook-linkcheck2 --locked
      - run: just link-check

  test-x64:
    runs-on: [ktstr-x64]
    strategy:
      fail-fast: false
      matrix:
        kernel-version: ['6.14', '7.0']
        features: ['', 'wprof']
    env:
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5
      - name: Provision Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
      - run: cargo install just
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: just kernel-build ${{ matrix.kernel-version }}
      - run: just test ${{ matrix.kernel-version }} ${{ matrix.features }}
      - if: ${{ !cancelled() }}
        run: just sccache-stats
      - if: ${{ !cancelled() }}
        run: just stats
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml
          report_type: test_results

  test-arm64:
    runs-on: [ktstr-arm64]
    strategy:
      fail-fast: false
      matrix:
        kernel-version: ['6.14', '7.0']
        features: ['', 'wprof']
    env:
      CARGO_BUILD_JOBS: "32"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5
      - name: Provision Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
      - run: cargo install just
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: just kernel-build ${{ matrix.kernel-version }}
      - run: just test ${{ matrix.kernel-version }} ${{ matrix.features }}
      - if: ${{ !cancelled() }}
        run: just sccache-stats
      - if: ${{ !cancelled() }}
        run: just stats
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml
          report_type: test_results

  coverage-x64:
    runs-on: [ktstr-x64]
    env:
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5
      - name: Provision Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
      - run: cargo install just
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: just kernel-build
      - run: just coverage wprof
      - if: ${{ !cancelled() }}
        run: just sccache-stats
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: x64

  coverage-arm64:
    runs-on: [ktstr-arm64]
    env:
      CARGO_BUILD_JOBS: "32"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5
      - name: Provision Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
      - run: cargo install just
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: just kernel-build
      - run: just coverage wprof
      - if: ${{ !cancelled() }}
        run: just sccache-stats
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: arm64
