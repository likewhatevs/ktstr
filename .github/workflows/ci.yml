# All commands live in the justfile so they are runnable locally via
# `just <recipe>`.  The YAML handles only checkout, toolchain, cache, and
# tool installation; every `run:` step that does actual CI work calls a
# justfile recipe (toolchain and tool-install steps run inline).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  KTSTR_GHA_CACHE: "1"
  RUSTC_WRAPPER: sccache
  # Lifts github.com unauth rate limit (60/hr per IP, shared across
  # runners) to 1000/hr per-token for build.rs's busybox tarball fetch.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # lint + compile-fail run on the self-hosted runner (not ubuntu-latest):
  # the GitHub-hosted runner's small disk overflows while linking the full
  # debug test harness (cargo nextest builds every test binary), surfacing
  # as `No space left on device` and a downstream `ld ... signal 7 [Bus
  # error]` (the linker mmaps the output and SIGBUSes on a full disk). The
  # self-hosted runner has ample disk and the build toolchain (clang,
  # bpftool, sccache) pre-installed. The toolchain is provisioned fresh via
  # rustup, which honors rust-toolchain.toml (minimal profile, no rust-src)
  # so the trybuild .stderr snapshots still match the same minimal output.
  # lint sets no `RUSTFLAGS` override: it does no target-binary linking
  # (only check/clippy/doc), so it needs no custom linker, and inheriting
  # .cargo/config.toml keeps the `-D warnings` lint depends on. compile-fail
  # overrides RUSTFLAGS for the linker (see below).
  lint:
    runs-on: [ktstr-x64]
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Provision Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
      - run: cargo install just
      - run: just lint

  compile-fail:
    runs-on: [ktstr-x64]
    # Match the self-hosted test jobs' linker (clang + mold) — the
    # default linker is untested on these runners, and compile-fail
    # links the full test harness. This overrides .cargo/config.toml's
    # rustflags, dropping `-D warnings`, which is fine: the lint job
    # enforces `-D warnings` crate-wide (--all-targets, both feature
    # sets), so compile-fail need not re-gate it.
    env:
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Provision Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
      - run: cargo install just
      - uses: taiki-e/install-action@v2.83.2
        with:
          tool: cargo-nextest
      - run: just compile-fail
      # ktstr-macros host unit tests — host-side + needs cargo-nextest
      # (installed above), so they ride the compile-fail job rather than
      # spinning a separate runner. cargo-ktstr's VM runner never discovers
      # this proc-macro crate, so this is the only place they run in CI.
      - run: just test-macros
      # Crate doctests — cargo-ktstr's VM runner and cargo-nextest both skip
      # `--doc`, so this is the only place `///` examples run in CI. Rides the
      # compile-fail job: host-side, already has the clang+mold linker that
      # doctest binaries need.
      - run: just test-doc

  # Pins Cargo's `[dev-dependencies]` isolation contract: a downstream
  # consumer adding ktstr as a dev-dep MUST NOT get ktstr compiled into
  # their release binary. Drives the `scripts::devdep-isolation`
  # rust-script recipe (scripts.just) via the `devdep-isolation` justfile
  # wrapper; the fixture lives in a standalone
  # crate (empty `[workspace]` table) so its resolver and target dir
  # are independent — exactly the perspective a real downstream
  # consumer has.
  #
  # Runs on the self-hosted runner alongside lint/compile-fail because
  # the fixture's `cargo build --release` reuses the same Rust
  # toolchain provisioning step (no kernel/nextest/cargo-llvm-cov needed
  # — the verify script does NOT run tests, only the prod-side build).
  devdep-isolation:
    runs-on: [ktstr-x64]
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Provision Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
      - run: cargo install just
      - run: cargo install rust-script --locked
      - run: just devdep-isolation

  docs-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: ./.github/actions/setup
        with:
          tools: mdbook@0.5,lychee@0.20
      - run: cargo install mdbook-linkcheck2 --locked
      - run: just link-check

  test-x64:
    runs-on: [ktstr-x64]
    strategy:
      fail-fast: false
      matrix:
        kernel-version: ['6.14', '7.1']
        features: ['', 'wprof']
    env:
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Provision Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
      - run: cargo install just
      - uses: taiki-e/install-action@v2.83.2
        with:
          tool: cargo-nextest
      - run: just kernel-build ${{ matrix.kernel-version }}
      - run: just test ${{ matrix.kernel-version }} ${{ matrix.features }}
      - if: ${{ !cancelled() }}
        run: just sccache-stats
      - if: ${{ !cancelled() }}
        run: just stats
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml
          report_type: test_results

  test-arm64:
    runs-on: [ktstr-arm64]
    strategy:
      fail-fast: false
      matrix:
        kernel-version: ['6.14', '7.1']
        features: ['', 'wprof']
    env:
      CARGO_BUILD_JOBS: "32"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Provision Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
      - run: cargo install just
      - uses: taiki-e/install-action@v2.83.2
        with:
          tool: cargo-nextest
      - run: just kernel-build ${{ matrix.kernel-version }}
      - run: just test ${{ matrix.kernel-version }} ${{ matrix.features }}
      - if: ${{ !cancelled() }}
        run: just sccache-stats
      - if: ${{ !cancelled() }}
        run: just stats
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml
          report_type: test_results

  # Live distro-resolution smoke suite (Layer 1): resolves every
  # supported distro against its real repo metadata and existence-probes
  # every resolved kernel + debuginfo URL WITHOUT downloading a body, so
  # an upstream URL/metadata-layout change trips CI in advance of anyone
  # trying to acquire the kernel. Cheap (metadata + ranged-GET probes),
  # so it runs every CI run on BOTH self-hosted runners — that also
  # covers each runner's network egress per arch. The tests resolve both
  # arches' metadata regardless of the host arch (metadata-only), so a
  # single runner already spans x86_64 + aarch64.
  distro-resolve:
    strategy:
      fail-fast: false
      matrix:
        runner: [ktstr-x64, ktstr-arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Provision Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
      - run: cargo install just
      - uses: taiki-e/install-action@v2.83.2
        with:
          tool: cargo-nextest
      - run: just test-distro-resolve

  # Full acquire+boot e2e (Layer 2): `kernel build --kernel <spec>` then
  # a real `shell --kernel <spec> --exec 'uname -r'` boot per bootable
  # distro, asserting the guest reports the RIGHT kernel. Sibling to the
  # test jobs on the same self-hosted runners (they have KVM); a sibling
  # rather than a matrix step so the boots run once, not once per
  # kernel-version × features cell. Cache hits are normal — a new
  # upstream kernel re-exercises the full download/extract/gate/boot. The
  # `local-package-boot` step packs the just-built kernel into a
  # synthetic .rpm and boots it, exercising the local-package path with
  # zero network. SteamOS is x86_64-only (Valve ships no other arch).
  distro-boot-x64:
    runs-on: [ktstr-x64]
    env:
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Provision Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
      - run: cargo install just
      - uses: taiki-e/install-action@v2.83.2
        with:
          tool: cargo-nextest
      # Build the kernel the hermetic local-package boot repacks.
      - run: just kernel-build 6.14
      - run: just distro-boot fedora 'fc[0-9]'
      - run: just distro-boot ubuntu generic
      - run: just distro-boot amazonlinux amzn2023
      - run: just distro-boot steamos neptune
      - run: just local-package-boot 6.14

  distro-boot-arm64:
    runs-on: [ktstr-arm64]
    env:
      CARGO_BUILD_JOBS: "32"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Provision Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
      - run: cargo install just
      - uses: taiki-e/install-action@v2.83.2
        with:
          tool: cargo-nextest
      - run: just kernel-build 6.14
      - run: just distro-boot fedora 'fc[0-9]'
      - run: just distro-boot ubuntu generic
      - run: just distro-boot amazonlinux amzn2023
      - run: just local-package-boot 6.14

  coverage-x64:
    runs-on: [ktstr-x64]
    env:
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Provision Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
      - run: cargo install just
      - uses: taiki-e/install-action@v2.83.2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: just kernel-build 7.1
      - run: just coverage 7.1 wprof
      - if: ${{ !cancelled() }}
        run: just sccache-stats
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: x64

  coverage-arm64:
    runs-on: [ktstr-arm64]
    env:
      CARGO_BUILD_JOBS: "32"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Provision Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
      - run: cargo install just
      - uses: taiki-e/install-action@v2.83.2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: just kernel-build 7.1
      - run: just coverage 7.1 wprof
      - if: ${{ !cancelled() }}
        run: just sccache-stats
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: arm64
