[workspace]
members = [".", "ktstr-macros", "scx-ktstr"]
resolver = "3"
# The verifier recursive-discovery e2e fixture's stand-in scheduler package.
# Excluded so `cargo check/clippy --workspace` never builds it (it needs clang
# + sched_ext BTF, present only where the KVM e2e itself runs); the fixture
# copies it into a generated workspace where it builds as a normal member.
exclude = ["tests/fixtures/scx_standin"]

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
license = "GPL-2.0-only"
repository = "https://github.com/likewhatevs/ktstr"

[package]
name = "ktstr"
version = "0.42.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Test harness for Linux process schedulers"
readme = "README.md"
keywords = ["sched_ext", "scheduler", "testing", "bpf", "linux"]
categories = ["development-tools::testing"]
documentation = "https://ktstr.dev/rustdoc/ktstr/"
exclude = [".build-cache/", "doc/guide/book/", ".github/", ".githooks/", ".config/"]

# docs.rs cannot compile the vendored libbpf C stack (no flex/bison) or
# fetch build-time blobs (no network), so build the docs WITHOUT the
# default `vendored` feature. `build.rs` detects `DOCS_RS` / the absent
# `vendored` feature and emits skeleton + blob stubs so rustdoc compiles
# the full public API. `export` is re-added because it is the only
# non-default feature that exposes a public module (`ktstr::export`);
# `cli-bins` / `integration` are dropped — they add only binaries and a
# global-allocator swap, no public library surface.
[package.metadata.docs.rs]
no-default-features = true
features = ["export"]

[dependencies]
anyhow = "1"
# Resolves the test project's `ktstr` dependency version (the version a
# test was built against) for the `cargo ktstr test` CLI↔test version
# guard. Only referenced from the cargo-ktstr bin tree (run_cargo.rs);
# gated behind `cli-bins` so a `default-features = false` library
# consumer drops it. Re-exports `semver`, so the guard uses
# `cargo_metadata::semver::Version` (one semver source, no version skew).
cargo_metadata = { version = "0.19", optional = true }
# Resolve Cargo's effective target runner with the same hierarchical config,
# environment, cfg-table, and relative-path semantics Cargo applies. Used only
# by cargo-ktstr's nextest pre-admission wrapper; downstream library consumers
# that disable `cli-bins` do not pull it in.
cargo-config2 = { version = "0.1", optional = true }
# Cargo's own target-table evaluator. cargo-ktstr uses the effective rustc
# target + `rustc --print cfg` output to decide whether a target-specific
# optional ktstr edge can participate in the test build.
cargo-platform = { version = "0.1", optional = true }
clap = { version = "4", features = ["derive"] }
# Shell-completions generator for the `ktstr completions` /
# `cargo ktstr completions` subcommands. Only referenced from the
# bin trees (`src/bin/ktstr.rs` + `src/bin/cargo_ktstr/...`); the
# library doesn't touch it. Gated behind the `cli-bins` feature so
# downstream `[dev-dependencies] ktstr = { default-features = false }`
# consumers drop it from their transitive set.
clap_complete = { version = "4", optional = true }
crc32fast = "1.5"
# Binary serialization for bulk-port TLV payloads (AssertResult,
# PayloadMetrics, WorkerReport) and sidecar disk
# persistence (cast_analysis_load). Pre-1.0 — old sidecar /
# baseline data is disposable; re-running tests regenerates the
# cache.
#
# postcard chosen over rkyv: ktstr's payloads are <1MB and
# decoded once per test, so rkyv's zero-copy access wins are
# irrelevant. postcard's serde-based shape preserves the existing
# `#[derive(Serialize, Deserialize)]` derives on every payload
# type — no separate type tree, no derive ceremony, no alignment
# requirements, no format-pinning headaches.
postcard = { version = "1", features = ["use-std"] }
itoa = "1"
gix = { version = "0.83", default-features = false, features = ["sha1", "blocking-network-client", "blocking-http-transport-curl-rustls", "worktree-mutation", "status", "revision", "progress-tree", "tree-editor", "parallel"] }
reqwest = { version = "0.13", features = ["blocking"] }
# Streaming XML pull-parser for distro repo metadata (repomd.xml and
# the multi-MB primary.xml the Fedora / Amazon Linux resolvers walk in
# `src/distro/repo.rs`). Used in streaming (`Reader::read_event`) mode
# so a 70+ MB decompressed primary.xml is filtered package-by-package
# without materializing a DOM. Already present transitively; pinned as
# a direct dep so the distro resolver doesn't lean on another crate's
# re-export surface.
quick-xml = "0.38"
tar = "0.4"
tempfile = "3"
xz2 = { version = "0.1", features = ["static"] }
# GitHub Actions cache backend, used only by src/remote_cache.rs.
# Gated behind the `remote-cache` feature (off by default). With
# the feature off, remote_cache::is_enabled() returns false
# unconditionally and the lookup/store entry points become no-ops,
# so call sites need no `#[cfg]` gating.
opendal = { version = "0.56", default-features = false, features = ["services-ghac"], optional = true }
# tokio runtime for opendal's async surface in remote_cache.rs.
# Tied to the same feature as opendal — neither is referenced
# anywhere else in the crate.
tokio = { version = "1", features = ["rt"], optional = true }
zstd = { version = "0.13", features = ["zstdmt"] }
lz4_flex = { version = "0.13", features = ["frame"] }
flate2 = "1"
glob = "0.3"
# Pure-Rust RPM parser/builder for the `--kernel` prebuilt-package path
# (src/distro/extract.rs): parses the lead/signature/main headers to
# recover arch + NEVRA and hands back the raw cpio payload plus its
# declared compressor, which the module decompresses with the already-
# vendored xz2/zstd/flate2 stack rather than pulling rpm's own liblzma
# backend. `default-features = false` drops the PGP signing/verification
# tree (pgp, chrono, getrandom) the extractor never touches; `payload`
# + `gzip-compression` + `zstd-compression` enable the PackageBuilder
# compressor stack (reusing the vendored flate2 + zstd, no new codec
# crate) that the unit tests use to synthesize fixture rpms at test
# time; production only parses.
rpm = { version = "0.25", default-features = false, features = ["payload", "gzip-compression", "zstd-compression"] }
# Stack-resident iovec/guard scratch for the virtio-blk vectored
# read/write handlers (src/vmm/virtio_blk/device.rs): inline capacity
# MAX_BLK_IOVECS (SEG_MAX*2 = 256) covers the proven worst case so a
# legitimate-guest request builds its iovec chain with zero heap
# allocation. Already pulled in transitively (vm-memory / gix /
# tracing-subscriber and others), so promoting it to a direct dep adds
# no new crate to the build. cloud-hypervisor uses the same
# SmallVec<[libc::iovec; N]> pattern in its block device.
# `const_generics` makes SmallVec<[T; N]> compile for any N (blanket
# Array impl); without it only smallvec's hand-listed array sizes work,
# so a future SEG_MAX whose *2 lands on a non-blessed size would fail
# to compile with an opaque "Array not implemented" error.
smallvec = { version = "1", features = ["const_generics"] }
# `proc_macro` default feature kept on: tests/private_module_paths.rs
# pins the `::ktstr::__private::ctor::ctor(...)` re-export so the
# proc-macro form stays compilable for downstream consumers.
ctor = "1"
libc = "0.2"
nix = { version = "0.31", features = ["event", "feature", "fs", "inotify", "kmod", "mount", "poll", "process", "ptrace", "reboot", "sched", "signal", "term", "uio"] }
blazesym = { version = "0.2", features = ["dwarf"] }
rand = "0.10"
rmesg = { version = "1", default-features = false, features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
toml = { version = "1.1", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
btf-rs = "2.0"
kvm-bindings = { version = "0.14", features = ["fam-wrappers"] }
kvm-ioctls = "0.24"
# libbpf stack. `default-features = false` on both (dropping their
# `vendored-libbpf` default) so vendoring is driven solely by ktstr's
# own `vendored` feature below — this is what lets `[package.metadata.
# docs.rs]` build the crate WITHOUT the vendored C stack (the docs.rs
# sandbox has no flex/bison and no network to compile libbpf/libelf/
# zlib). For every normal build the default `vendored` feature turns
# these back on, so the resolved feature set is unchanged: libbpf-sys's
# `default` only expands to `vendored-libbpf`, a subset of the `vendored`
# we enable.
libbpf-rs = { version = "0.26", default-features = false }
libbpf-sys = { version = "1.6", default-features = false }
linux-loader = { version = "0.13", features = ["bzimage", "elf", "pe"] }
vm-memory = { version = "=0.17.1", features = ["backend-mmap"] }
vmm-sys-util = "0.15"
cpio = "0.4.1"
virtio-bindings = "0.2.7"
virtio-queue = "0.17"
vm-superio = "0.8.1"
zerocopy = { version = "0.8.48", features = ["derive"] }
linkme = "0.3"
ktstr-macros = { version = "0.42.0", path = "ktstr-macros" }
goblin = { version = "0.10.5", features = ["elf64"] }
# Memory-map /proc/self/exe in the coverage-instrumentation detection
# probe (`is_coverage_instrumented_binary` / `find_symbol_vaddrs` in
# `src/test_support/profraw.rs`) to walk `.symtab` instead of reading the
# whole binary into a Vec<u8>. Coverage-instrumented test binaries are
# large (hundreds of MiB to ~1 GiB), so the read+copy cost matters.
# (`try_flush_profraw` itself no longer parses the ELF — under
# `cfg(coverage)` it calls the compiler-rt buffer API directly.) Already
# in the dep tree transitively (blazesym, gix); pinned here so
# `src/test_support/profraw.rs` doesn't depend on either crate's
# re-export surface.
memmap2 = "0.9"
# DWARF parser for resolving struct-member offsets in jemalloc's tsd_t
# at probe time (jemalloc-probe binary). Already present transitively
# via blazesym; pinned as a direct dep so the probe's offset-recovery
# path doesn't depend on blazesym's re-export surface.
gimli = "0.33"
rayon = "1"
# ELF reader/writer. `features = ["build"]` pulls in the full
# `object::build::elf::Builder` surface used by `elf_strip.rs` and
# `src/cache/vmlinux_strip.rs` for SHT_NOBITS rewriting. `cargo tree --duplicates` may
# still report a second `object` instance reached transitively via
# `ar_archive_writer` (build-dep of `psm` / `stacker`) with only the
# `memchr` feature; that second instance is a build-script compilation
# artifact and does not link into any shipped binary.
object = { version = "0.39", default-features = false, features = ["build"] }
walkdir = "2"
indicatif = "0.18"
# Table rendering for stats and verifier CLI output. Replaces hand-rolled
# `format!("{:<30}...")` layouts plus `"-".repeat()` separators with a
# builder API that measures column widths from actual content, so labels
# like `scenario/topology/work_type` stop spilling into adjacent columns
# when topology names exceed the previously hardcoded 30-column width.
# Default features pull in crossterm for `Cell::fg(Color::Red/Green)` in
# the compare_runs VERDICT column; stdout TTY detection is handled by
# comfy-table itself (see `crate::cli::new_table`).
comfy-table = "7.2"
# Stable hash for cache keys — std::hash::DefaultHasher is not
# guaranteed stable across toolchain versions; siphasher::sip::SipHasher13
# pins the algorithm so cached artifacts survive Rust updates.
siphasher = "1"
# SIMD-accelerated byte-pattern search for IKCONFIG extraction from
# stripped vmlinux images (tens of MB each). `windows().position()`
# with an 8-byte needle is O(n) in naive byte compares; memmem uses
# a two-way algorithm with x86_64 AVX2 / aarch64 Neon when available.
memchr = "2"
# C parser for extracting struct definitions from scx BPF source files.
# Used by cargo-ktstr's BTF type anchor generator to force clang to
# retain struct types that would otherwise be eliminated by inlining +
# dead-code elimination. tree-sitter-c parses any C formatting without
# regex fragility.
#
# Only referenced from `src/bin/cargo_ktstr/btf_catalog.rs`, included
# from the `cargo-ktstr` bin. Gated behind the `cli-bins` feature so
# downstream `[dev-dependencies] ktstr = { default-features = false }`
# consumers drop them (plus a handful of small transitives —
# tree-sitter-language, streaming-iterator) from their build.
tree-sitter = { version = "0.26", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
# Human-readable duration parsing for the `--watch <interval>` flag on
# `ktstr locks`. Accepts "100ms", "1s", "5m", "1h" forms per rev 5 §6.
# Tiny crate (~2 modules, zero non-std deps).
humantime = "2"
# Safe wrappers around direct syscalls — replaces ad-hoc
# `libc::uname`/`libc::flock`/`libc::shm_open` sites that each reinvent
# fd ownership and errno handling. Keeps the libc dep around because
# not every call we make has a rustix equivalent we consume yet (mmap,
# some signal paths), but the flock+uname+shm surface migrates cleanly.
rustix = { version = "1", features = ["fs", "shm", "system"] }
# Derive macros for enum-level operations. `VariantNames` auto-generates
# the list of variant names so `WorkType::ALL_NAMES` stays in lock-step
# with the enum definition without a hand-maintained parallel table.
strum = { version = "0.28", features = ["derive"] }
# Levenshtein edit distance for the "did you mean?" suggestion in
# `cli::show_thresholds`'s unknown-test-name error path. Already
# present transitively via clap — promoting it to a direct dep makes
# the intent explicit and survives a future clap version that drops
# the transitive exposure.
strsim = "0.11"
# Base64 codec for `cargo ktstr export`'s self-extracting .run files
# and Google Cloud Storage's published MD5 artifact digests.
#
# The export code itself remains feature-gated; the small codec is
# unconditional because `--kernel gke` acquisition is core runtime
# functionality.
base64 = "0.22"
md-5 = "0.10"
# jemalloc as global allocator for the shipped binaries. Each binary
# declares it at its crate root. Integration-test binaries stay
# allocator-agnostic because they are also packed as guest `/init`, where
# jemalloc is unrelated to the scenario and must not expand the guest
# correctness surface. `stats` compiles
# jemalloc with internal per-allocation bookkeeping so
# `tikv-jemalloc-ctl`'s `stats.{allocated,active,resident,mapped}`
# mallctl reads return populated values instead of failing with
# EPERM; `host_heap::collect` depends on this.
#
# Referenced from the `#[global_allocator]` declarations in the binary crate
# roots.
# `tikv-jemallocator` is gated behind the `cli-bins` feature. The ctl
# dependency below remains unconditional, so allocator-agnostic library
# consumers can read jemalloc's linked-instance metadata; host-context
# capture omits it unless a binary explicitly marks jemalloc as global.
tikv-jemallocator = { version = "0.6", features = ["stats"], optional = true }
# Safe wrappers for the jemalloc mallctl introspection surface. Used
# by `host_heap` to capture the running binary's heap footprint
# (active / allocated / resident / mapped bytes, arena count) as part
# of the sidecar's HostContext. Reads return `Err` when the linked
# allocator is not jemalloc, so downstream consumers that do NOT
# enable `tikv-jemallocator` land the heap state as `None` cleanly.
# `stats` feature gates the `stats::*` submodule (allocated/active/
# resident/mapped); without it the submodule is absent at compile
# time. `arenas::narenas` is exposed unconditionally.
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
# Regex synthesis from a list of literal strings — used by
# `ctprof_compare` to render human-readable display labels for
# pattern-aggregated thread-name groups (e.g. 4 threads named
# `tokio-runtime-worker-0..3` collapse to a regex showing the
# shared prefix + alternation). The internal join key stays as the
# deterministic strip-trailing-digit prefix; grex is invoked at
# render time only, on bucket-member literals (≥2 entries), to
# produce a regex string operators can read or paste into tooling.
# Gated behind the `pretty-labels` feature (off by default); when
# the feature is disabled, `pattern_display_label` falls back to
# the join key unchanged — same observable shape, just less polish.
# `default-features = false` drops the binary CLI surface (clap,
# colored, indoc) so only the library trait is pulled in.
grex = { version = "1.4", default-features = false, optional = true }
# SHA-256 for one-shot digest verification of downloaded artifacts
# (fetch.rs), cache-key fingerprinting (disk_template.rs), and seeded
# key derivation (fun.rs). Not on the test hot path.
sha2 = "0.11"
# Lowercase hex encoding for SHA-256 digest comparisons.
hex = "0.4"
# Two-sample significance testing for perf-delta's `--noise-adjust` mode
# (src/stats/noise.rs): the `StudentsT` distribution (cdf/sf) turns a Welch
# t-statistic into a p-value, and `Statistics::variance` gives per-side Bessel
# (N-1) sample variance. Replaces the old within-side range-spread gate, which
# inverted signal and noise — it suppressed a real regression whose degraded
# side was high-variance while reporting trivial low-variance moves.
# `default-features = false` drops the `nalgebra` feature (multivariate
# distributions we do not use); univariate `StudentsT` is ungated, so the add is
# +2 crates (statrs + approx), not the full nalgebra linear-algebra stack.
statrs = { version = "0.18", default-features = false }
# Error-enum derives (`#[derive(thiserror::Error)]`) for the crate's
# structured error types (disk_config, topology, workload types).
# v2's `#[source]` attribute matches the structured-error pattern
# this crate's error-handling design favors.
thiserror = "2"

# Compiled regex patterns for the token-based pattern_key
# normalizer in `src/ctprof_compare/pattern.rs`. Used to express the
# spec rules in `classify_token` (`^\d+$`, `^[0-9a-f]+$`,
# `^[A-Za-z]+\d+$`, `^\d+[A-Za-z]+$`) literally rather than as
# hand-rolled char loops, so the rules read identically to the
# spec. Already a transitive dep via `fancy-regex` and others;
# promoted to a direct dep so the import sites are explicit.
regex = "1"

# Netlink stack for the taskstats genetlink capture path
# (`src/taskstats.rs`). The three crates layer cleanly:
#   `netlink-sys`             — AF_NETLINK socket + sendto/recv.
#   `netlink-packet-core`     — `NetlinkMessage<T>` envelope, ALIGN handling,
#                                multipart-reply assembly.
#   `netlink-packet-generic`  — generic-netlink (genetlink): `GenlMessage<T>`
#                                wrapper, CTRL_CMD_GETFAMILY family-id lookup.
# Hand-rolled genetlink against raw libc would be ~300 lines of
# protocol parsing (NLA alignment, multipart NLM_F_MULTI handshake,
# CTRL family lookup) — established crate stack avoids that
# correctness risk.
netlink-sys = "0.8"
netlink-packet-core = "0.8"
netlink-packet-generic = "0.4"

# Bindgen-generated bindings for the `perf_event_open(2)` syscall and
# its `perf_event_attr` struct. The Linux libc and the Rust libc crate
# both deliberately omit these — perf-event-open-sys provides the
# bitfield setters (`set_exclude_host`, `set_disabled`) and the
# kernel-version-tolerant struct layout (per its top-of-crate docs:
# old programs run on new kernels and vice versa). Used by
# `src/monitor/perf_counters.rs` to open one fd per (vCPU, hardware
# counter) with `exclude_host=1` so the PMU counts only what executes
# inside the guest. Disambiguates host-thread idle/spin/productive
# work without any in-guest overhead.
perf-event-open-sys = "6"
ahash = "0.8"

# Flattened device tree writer for the aarch64 boot path
# (src/vmm/aarch64/fdt.rs). The arch mod itself is already
# `#[cfg(target_arch = "aarch64")]`-gated, so the dep follows
# the same target predicate — x86_64 builds (the majority) skip
# vm-fdt and its transitives entirely.
[target.'cfg(target_arch = "aarch64")'.dependencies]
vm-fdt = "0.3"

[profile.release]
lto = "thin"
panic = "abort"

# Trim test-binary DWARF to line tables only. Test binaries are
# large with full debug info, of which DWARF is the dominant
# component; line-tables-only meaningfully shrinks the binary,
# reducing cold-load page-fault traffic on CI runners. file:line
# backtraces stay actionable (assert!/panic!/#[track_caller] all
# print location), only debugger variable inspection is lost.
# Override via `CARGO_PROFILE_TEST_DEBUG=full` for a one-off
# interactive debug session. The nextest sched_stats timeout
# override stays as defense-in-depth — this addresses the
# binary-size root cause; the timeout is the symptom budget.
#
# opt-level 1 for the same reason, one layer down. `cargo test` builds
# the whole graph under this profile — raising `[profile.dev]` alongside
# it was measured and moved the test binary by under 100 bytes — and that
# binary is packed as the guest's `/init`, LZ4'd into the initrd CAS,
# and unpacked into guest tmpfs on every cell. Measured on
# ktstr_sched_tests: stripped 83.8 MB -> 41.1 MB, its LZ4 payload
# 34.2 MB -> 19.7 MB, and the unit suite 219 s -> 36 s, for +28 s of
# build wall. opt-level 2 buys 2.3 MB more stripped for another 11 s of
# build, which does not pay for itself on a per-lane build.
#
# `debug-assertions` and `overflow-checks` are spelled out rather than
# left to the dev defaults: they are the assertion coverage every test
# and every guest runs with, and a raised opt-level must never be read
# as license to drop them.
[profile.test]
debug = "line-tables-only"
opt-level = 1
debug-assertions = true
overflow-checks = true

[features]
default = ["cli-bins", "vendored"]
# Statically vendor libbpf/libelf/zlib from libbpf-sys's bundled C
# sources and pull in libbpf-cargo for build-time BPF skeleton
# generation. DEFAULT-ON: every functional build needs it because
# build.rs generates the kprobe/fentry skeletons at compile time. It
# exists as a separate feature for exactly one reason — docs.rs cannot
# compile the vendored C stack (its sandbox has no flex/bison and no
# network), so `[package.metadata.docs.rs]` builds with
# `no-default-features` to drop it and documents against the
# DOCS_RS-gated skeleton stubs `build.rs` emits (src/bpf/docsrs_*.rs).
# A downstream `default-features = false` consumer that actually loads
# BPF (i.e. runs tests, not just documents) must re-add it:
#   ktstr = { version = "...", default-features = false, features = ["vendored"] }
# Building without it yields a library whose BPF skeletons are stubbed
# and cannot be loaded at runtime (build.rs prints a warning).
vendored = ["dep:libbpf-cargo", "libbpf-rs/vendored", "libbpf-sys/vendored"]
# `integration` pulls `cli-bins` because the jemalloc introspection
# fixtures (`ktstr-jemalloc-{probe,alloc-worker}`, gated on cli-bins +
# integration) are `env!(CARGO_BIN_EXE_…)`'d by their e2es, and cargo
# resolves features per-build — so the whole e2e suite needs cli-bins for
# those fixtures to build. (The guest-`/init` memory-constrained OOM is
# fixed by `vm.overcommit_memory=1` on the guest cmdline, NOT the
# allocator, so the e2e `/init`'s jemalloc is incidental.) lib.rs
# `compile_error!`s if this implication is ever broken.
integration = ["cli-bins"]
# Dependencies for the `src/bin/*.rs` entry points. The two
# user-facing bins (`ktstr`, `cargo-ktstr`) carry
# `required-features = ["cli-bins"]`; the four integration-gated fixture
# bins (`ktstr-jemalloc-probe`, `ktstr-jemalloc-alloc-worker`,
# `ktstr-schbench-validate`, `ktstr-taobench-validate`) additionally
# require `integration`, so a default `cargo install ktstr` builds only
# the two user-facing bins.
#   - `tikv-jemallocator` — process-wide `#[global_allocator]` swap.
#   - `clap_complete` — `completions` subcommand on `ktstr` / `cargo-ktstr`.
#   - `tree-sitter` + `tree-sitter-c` — BTF type-anchor codegen for
#     cargo-ktstr's test/coverage paths.
# Default-on so `cargo install --locked ktstr` keeps working unchanged;
# a `[[bin]]` is silently skipped (rather than failing to compile) when
# its required features are off. Downstream library consumers wanting a
# leaner dev-dep transitive set drop these by passing
# `default-features = false` — but must keep `vendored` (see below), or
# the BPF skeletons are stubbed and cannot load at runtime:
#
#   [dev-dependencies]
#   ktstr = { version = "0.26.0", default-features = false, features = ["vendored"] }
cli-bins = [
    "dep:tikv-jemallocator",
    "dep:clap_complete",
    "dep:cargo-config2",
    "dep:cargo-platform",
    "dep:cargo_metadata",
    "dep:tree-sitter",
    "dep:tree-sitter-c",
    "dep:toml",
    "export",
]
# `cargo ktstr export` self-extracting `.run` file generator
# (`src/export.rs`). Off-by-default for a
# `default-features = false` library consumer; the `cli-bins`
# umbrella feature pulls it in so the bin install flow still has the
# `export` subcommand wired through the test-binary dispatch path.
export = []
# Embed the wprof BPF tracer for Perfetto-format profiling in VMs.
# Default off: one elected build fetches github.com/anakryiko/wprof through
# in-process gix and compiles libbpf + blazesym (requires make, gcc, clang,
# mold, elfutils-devel, zlib-devel on the host; takes several minutes cold).
wprof = [
    "ktstr-macros/wprof",
    "dep:gix",
]
# Pretty thread-name labels in `ctprof_compare` output. Enables
# `grex` regex synthesis to render multi-member buckets as a
# minimal regex (e.g. `tokio-runtime-worker-[0-3]`). With this
# feature off, `pattern_display_label` falls back to the join key
# (e.g. `tokio-runtime-worker`) — identical aggregation, less
# polish. Worth enabling for interactive use of the compare CLI.
pretty-labels = ["dep:grex"]
# GitHub Actions cache integration for cargo-ktstr's blob store
# (`src/remote_cache.rs`). Off by default: only CI runs with
# `KTSTR_GHA_CACHE=1` + `ACTIONS_CACHE_URL` set actually use the
# remote backend. With the feature off, `remote_cache::is_enabled()`
# returns false and the lookup/store entry points are no-ops, so
# call sites in `cli/resolve.rs` and `cli/kernel_build/build.rs`
# transparently skip the remote path. Pulls in `opendal` + a
# minimal `tokio` runtime; saves both transitive trees on local dev.
remote-cache = ["dep:opendal", "dep:tokio"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(coverage_nightly)'] }

[dev-dependencies]
assert_cmd = "2"
fs2 = "0.4"
jobserver = "0.1"
insta = "1"
predicates = "3"
proptest = "1"
# Grok-style structured log matcher. Used by the watchdog timing
# precision test to extract the sched_ext stall duration from the
# kernel's SCX_EXIT_ERROR_STALL message ("…failed to run for
# N.NNNs"). `default-features = false` disables the default `onig`
# C-regex engine (which would drag in a C library build). The
# `fancy-regex` engine is the minimum that supports the lookbehind
# and atomic-group constructs grok's default `BASE10NUM` / `NUMBER`
# patterns use; the pure-`regex` backend rejects those patterns
# at compile time.
grok = { version = "2", default-features = false, features = ["fancy-regex"] }
# In-test tracing subscriber that captures `tracing::warn!` /
# `tracing::info!` events into a per-test buffer, queryable via
# `logs_contain(&str)`. Used by the `set_rt_priority_warns_without_cap`
# unit test to pin that the CAP_SYS_NICE-absent path emits an
# actionable warn event — converted from a pure `eprintln!` that no
# test could observe. Default feature set filters to the current
# crate's tracing events, which matches the unit-test use case
# where the event originates from ktstr itself.
tracing-test = "0.2"
trybuild = "1"
mockito = "1"
# `test-utils` feature on the existing virtio-queue dep — gates the
# upstream `mock` module (`MockSplitQueue`, `desc_chain` builders)
# used by virtio-blk descriptor-chain tests. Pinned as a separate
# dev-dep entry rather than via `features = [...]` on the main
# `[dependencies]` line so the mock infrastructure does NOT leak
# into shipped binaries.
virtio-queue = { version = "0.17", features = ["test-utils"] }

[build-dependencies]
# Fixed-seed, non-cryptographic content identity for both prebuilt blob
# handoffs. Unconditional because busybox is prepared on the default build;
# the wprof source-acquisition path reuses the same host-side crate.
ahash = "0.8"
# The build-script blob CAS is used by the default BusyBox build, so its
# cross-process publication lock cannot be gated on the optional wprof path.
fs2 = "0.4"
# Optional with `wprof`: default builds do not compile a second host-side gix
# graph merely for a build-script path that is disabled.
gix = { version = "0.83", default-features = false, features = ["sha1", "blocking-network-client", "blocking-http-transport-curl-rustls", "worktree-mutation", "progress-tree", "parallel"], optional = true }
jobserver = { version = "0.1" }
cc = "1"
flate2 = "1"
# BPF skeleton generator, invoked by build.rs. Optional + pulled in by
# the default `vendored` feature: docs.rs builds with `no-default-
# features` and never generates skeletons (build.rs stubs them), so it
# drops libbpf-cargo entirely — otherwise libbpf-cargo would drag in a
# vendored libbpf-sys on the build-dependency side and re-break the
# docs.rs sandbox on flex.
libbpf-cargo = { version = "0.26", optional = true }
reqwest = { version = "0.13", features = ["blocking"] }
# SHA-256 for build-script tarball integrity verification (busybox
# pin in build.rs). Same crate the runtime uses for artifact
# verification — single algorithm across every hashing site.
sha2 = "0.11"
# Stable hash for BTF content drift detection in build.rs.
# Reusing the same crate ktstr uses for sidecar_variant_hash keeps
# the dep graph narrow and pins one algorithm across every hashing
# site in the project. See build.rs `siphash_13` for the call site.
siphasher = "1"
tar = "0.4"

